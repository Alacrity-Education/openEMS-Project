name: "docker image"

# openEMS with the SYCL GPU backend and gerber2ems (docker/Dockerfile),
# published as ghcr.io/<owner>/openems-sycl.

on:
  push:
    branches:
        - sycl-backend
    tags:
        - 'v*'
    paths:
        - 'docker/**'
        - '.github/workflows/docker.yml'
        - '.gitmodules'
        - 'openEMS'
        - 'update_openEMS.sh'
        - 'scripts/**'
  workflow_dispatch:
    inputs:
      ref:
        description: "openEMS-Project branch, tag or commit to build (default: the workflow's commit)"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      # the builder stage (oneAPI compiler, build tree) needs ~15 GB
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h

      # the build context (docker/) comes from the checkout; the Dockerfile clones the sources itself
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/openems-sycl
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/sycl-backend' }}

      # The Dockerfile clones the project itself (submodules from .gitmodules,
      # i.e. openEMS from the Alacrity-Education fork), at the pushed commit.
      # No layer cache: the builder layers exceed the 10 GB GitHub cache.
      - uses: docker/build-push-action@v6
        with:
          context: docker/
          file: docker/Dockerfile
          platforms: linux/amd64
          build-args: |
            PROJECT_REPO=https://github.com/${{ github.repository }}.git
            PROJECT_REF=${{ inputs.ref || github.sha }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Image tags
        run: echo "${{ steps.meta.outputs.tags }}"
